<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:*; font-src 'self'; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:* ws://localhost:* http://localhost:*"
    />
    <title>OpenClaw Windows Electron</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1016;
        --surface: #131b25;
        --surface-border: #243345;
        --text: #edf5ff;
        --muted: #9ab2ca;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(1000px 460px at -10% -10%, #143b56 0%, transparent 62%),
          radial-gradient(840px 560px at 110% 120%, #1b3f33 0%, transparent 62%),
          var(--bg);
      }

      .host-layout {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto auto auto;
        gap: 12px;
        padding: 14px;
      }

      .host-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        background: linear-gradient(180deg, #121c28 0%, #111823 100%);
        padding: 14px;
      }

      .host-header h1 {
        margin: 0;
        font-size: 20px;
      }

      .host-header p {
        margin: 6px 0 0;
      }

      .status-bar {
        border: 1px solid var(--surface-border);
        border-radius: 10px;
        background: var(--surface);
        padding: 10px 12px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .btn {
        border: 1px solid #2f4259;
        background: #182638;
        color: var(--text);
        border-radius: 9px;
        padding: 8px 12px;
        cursor: pointer;
      }

      .btn:hover {
        border-color: #426584;
      }

      .btn:disabled {
        opacity: 0.65;
        cursor: default;
      }

      .btn-primary {
        border-color: #2c76b6;
        background: #1b4f7a;
      }

      .mono {
        font-family: "Cascadia Code", Consolas, monospace;
      }

      .note-card {
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        background: #121c27;
        padding: 14px;
      }

      .note-card h2 {
        margin: 0;
        font-size: 18px;
      }

      .note-card ol {
        margin: 10px 0 0;
        padding-left: 22px;
      }

      .note-card li {
        margin: 6px 0;
      }

      .guidance {
        margin: 10px 0 0;
        font-weight: 600;
      }

      .guidance-ok {
        color: #8be1b0;
      }

      .guidance-warn {
        color: #ffd782;
      }

      .guidance-error {
        color: #ff9b9b;
      }

      .error-banner {
        border: 1px solid #a84f4f;
        border-radius: 10px;
        background: #4f1f1f;
        color: #ffd9d9;
        padding: 10px 12px;
      }

      .muted {
        color: var(--muted);
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
